<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣水電費分攤工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 歷史紀錄面板動畫 */
        .history-panel {
            transition: transform 0.3s ease-in-out;
        }
        .history-panel.closed {
            transform: translateX(100%);
        }
        .history-panel.open {
            transform: translateX(0);
        }
        /* Toast 通知 (層級提高到 70) */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 70; 
        }
        .toast.show {
            opacity: 1;
        }
        /* Checkbox 動畫 */
        .check-circle {
            transition: all 0.2s;
        }
        .check-circle.checked {
            background-color: #059669;
            border-color: #059669;
            color: white;
        }
    </style>
</head>
<body class="text-gray-700 min-h-screen flex flex-col items-center py-6 px-4">

    <!-- 主容器 -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden animate-fade-in relative z-10">
        
        <!-- 標題區 -->
        <div class="bg-slate-800 p-6 text-center relative">
            <!-- 左上角：重新/清空按鈕 -->
            <button onclick="resetCalculator()" class="absolute left-4 top-1/2 -translate-y-1/2 p-2 text-slate-400 hover:text-white transition rounded-full hover:bg-slate-700" title="重新計算下一筆">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
            </button>

            <h1 class="text-xl font-bold text-white tracking-wide">水電費分攤工具</h1>
            <p class="text-slate-400 text-sm mt-1">按實際用量公平分攤帳單</p>
            
            <!-- 右上角：歷史紀錄按鈕 -->
            <button onclick="toggleHistory()" class="absolute right-4 top-1/2 -translate-y-1/2 p-2 text-slate-400 hover:text-white transition rounded-full hover:bg-slate-700" title="歷史紀錄">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            </button>
        </div>

        <!-- 輸入表單 -->
        <div class="p-6 space-y-6">
            <div>
                <label for="utilityType" class="block text-sm font-bold text-gray-600 mb-2">帳單類型</label>
                <select id="utilityType" onchange="changeUtility(this.value)"
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-slate-500 focus:outline-none focus:bg-white transition text-slate-800">
                    <option value="electricity">⚡ 電費</option>
                    <option value="water">💧 水費</option>
                </select>
            </div>
            
            <!-- 帳單總金額 -->
            <div>
                <label class="block text-sm font-bold text-gray-600 mb-2">本期帳單總金額 ($)</label>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">$</span>
                    <input type="number" inputmode="decimal" min="0" id="totalBill" placeholder="例如: 2800"
                        class="w-full pl-8 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-slate-500 focus:outline-none focus:bg-white transition text-lg font-medium text-slate-800 placeholder-gray-300">
                </div>
            </div>

            <hr class="border-dashed border-gray-200">

            <!-- 房間度數輸入區 -->
            <div>
                <div class="flex justify-between items-end mb-2">
                    <label id="meterLabel" class="block text-sm font-bold text-gray-600">各房電表度數</label>
                    <div class="flex gap-2">
                        <button type="button" onclick="removeRoom()" class="text-xs text-slate-500 hover:text-slate-800" aria-label="移除最後一個分表">− 移除</button>
                        <button type="button" onclick="addRoom()" class="text-xs font-bold text-emerald-600 hover:text-emerald-800" aria-label="新增分表">＋ 新增</button>
                    </div>
                </div>
                
                <div class="grid grid-cols-12 gap-2 text-xs text-gray-400 text-center mb-1 px-1">
                    <div class="col-span-2 text-left">名稱</div>
                    <div class="col-span-5">上期度數</div>
                    <div class="col-span-5">本期度數</div>
                </div>

                <div id="roomsContainer" class="space-y-3">
                    <!-- JS 生成 -->
                </div>
            </div>

            <!-- 計算按鈕 -->
            <button onclick="calculate()" 
                class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 rounded-xl shadow-lg transform active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16" y2="18"></line><path d="M16 10h.01"></path><path d="M12 10h.01"></path><path d="M8 10h.01"></path><path d="M12 14h.01"></path><path d="M8 14h.01"></path><path d="M12 18h.01"></path><path d="M8 18h.01"></path></svg>
                開始計算
            </button>
        </div>

        <!-- 結果顯示區 (預設隱藏) -->
        <div id="resultArea" class="hidden bg-slate-50 border-t border-gray-100 p-6 animate-fade-in">
            
            <!-- 總計卡片 -->
            <div class="bg-white border border-gray-200 rounded-xl p-4 mb-6 shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <span id="totalUsageLabel" class="text-sm text-gray-500">總用電量</span>
                    <span class="text-lg font-bold text-slate-700"><span id="totalUsageDisplay">0</span> <span id="totalUsageUnit">度</span></span>
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-dashed border-gray-100">
                    <span id="averagePriceLabel" class="text-sm text-gray-500">平均電價</span>
                    <span class="text-xl font-bold text-emerald-600">$<span id="unitPriceDisplay">0</span> / <span id="averagePriceUnit">度</span></span>
                </div>
            </div>

            <h3 class="text-sm font-bold text-gray-600 mb-3">分攤明細</h3>
            <div id="breakdownList" class="space-y-2 mb-6">
                <!-- JS 產生結果 -->
            </div>

            <!-- 新增：期數與備註輸入 (儲存前填寫) -->
            <div class="bg-white border border-gray-200 rounded-xl p-4 mb-4 shadow-sm">
                <div class="grid grid-cols-1 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">期數 / 月份 (選填)</label>
                        <input type="text" id="recordPeriod" maxlength="100" placeholder="例如: 112-05 或 5-6月"
                            class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-slate-400 transition placeholder-gray-300">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">備註 (選填)</label>
                        <input type="text" id="recordNote" maxlength="500" placeholder="例如: 已繳清、多退少補..."
                            class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-slate-400 transition placeholder-gray-300">
                    </div>
                </div>
            </div>

            <!-- 按鈕群組 -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="saveCurrentRecord()" 
                    id="saveBtn"
                    class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl transition flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    儲存紀錄
                </button>
                
                <button onclick="copyToClipboard()" 
                    class="bg-white border border-slate-300 text-slate-600 font-medium py-3 rounded-xl hover:bg-gray-50 transition flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    複製文字
                </button>
            </div>
        </div>
    </div>
    
    <!-- 提示訊息 Toast -->
    <div id="toast" class="toast"></div>

    <!-- 自製確認對話框 (層級提高到 60，確保蓋在歷史面板 50 之上) -->
    <div id="confirmModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[60] hidden flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-6 w-11/12 max-w-sm shadow-2xl transform scale-95 transition-transform duration-300" id="confirmBox">
            <h3 class="text-lg font-bold text-slate-800 mb-2" id="confirmTitle">確認</h3>
            <p class="text-slate-600 mb-6" id="confirmMessage">確定要執行此動作嗎？</p>
            <div class="flex gap-3">
                <button onclick="closeConfirmModal()" class="flex-1 py-3 text-slate-600 font-medium hover:bg-gray-50 rounded-xl border border-gray-200">取消</button>
                <button id="confirmActionBtn" class="flex-1 py-3 bg-red-500 text-white font-bold rounded-xl hover:bg-red-600 shadow-lg shadow-red-200">確定</button>
            </div>
        </div>
    </div>

    <footer class="mt-8 text-xs text-gray-400 text-center space-y-1">
        <p>資料儲存於您的瀏覽器中，不會上傳伺服器</p>
        <p><a class="underline hover:text-slate-600" href="https://github.com/chohcx/electric-bill" target="_blank" rel="noopener noreferrer">原始碼</a> · <a class="underline hover:text-slate-600" href="https://github.com/chohcx/electric-bill/issues/new/choose" target="_blank" rel="noopener noreferrer">回報問題或建議</a> · <a class="underline hover:text-slate-600" href="https://github.com/chohcx/electric-bill/issues/new?template=usage_feedback.yml" target="_blank" rel="noopener noreferrer">分享使用經驗</a></p>
    </footer>

    <!-- 歷史紀錄側邊欄 (Modal) (層級 50) -->
    <div id="historyOverlay" onclick="toggleHistory()" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300"></div>
    <div id="historyPanel" class="history-panel closed fixed top-0 right-0 h-full w-full max-w-sm bg-white shadow-2xl z-50 flex flex-col">
        <!-- 標題 -->
        <div class="bg-slate-800 p-4 text-white flex justify-between items-center shadow-md shrink-0">
            <h2 class="font-bold text-lg flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                歷史紀錄
            </h2>
            <button onclick="toggleHistory()" class="p-1 hover:bg-slate-700 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        
        <!-- 上方工具列 -->
        <div class="bg-slate-100 p-3 flex gap-2 border-b border-gray-200 shrink-0 relative" id="topToolbar">
            <!-- 預設模式 -->
            <div id="defaultTools" class="w-full flex gap-2">
                <button onclick="startNewCalculation()" class="flex-1 bg-white border border-emerald-500 text-emerald-600 text-sm py-2 px-3 rounded-lg shadow-sm hover:bg-emerald-50 flex items-center justify-center gap-1 font-medium transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    新增紀錄
                </button>
                <button onclick="toggleEditMode()" class="flex-1 bg-white border border-red-200 text-red-500 text-sm py-2 px-3 rounded-lg shadow-sm hover:bg-red-50 flex items-center justify-center gap-1 font-medium transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                    批量刪除
                </button>
            </div>

            <!-- 編輯模式 -->
            <div id="editTools" class="w-full flex gap-2 hidden">
                <button onclick="deleteSelected()" class="flex-1 bg-red-500 text-white text-sm py-2 px-3 rounded-lg shadow-sm hover:bg-red-600 flex items-center justify-center gap-1 font-medium transition">
                    <span id="deleteCountText">確認刪除 (0)</span>
                </button>
                <button onclick="toggleEditMode()" class="bg-gray-200 text-gray-600 text-sm py-2 px-4 rounded-lg hover:bg-gray-300 font-medium">
                    取消
                </button>
            </div>
        </div>

        <!-- 列表內容 -->
        <div id="historyContainer" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50 pb-20">
            <div class="text-center text-gray-400 mt-10">尚無紀錄</div>
        </div>

        <!-- 底部工具列 -->
        <div class="bg-white p-4 border-t border-gray-200 shrink-0">
            <div class="flex gap-3">
                <button onclick="exportData()" class="flex-1 bg-gray-100 text-slate-600 text-sm py-3 px-3 rounded-lg hover:bg-gray-200 flex items-center justify-center gap-2 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    備份匯出
                </button>
                <label class="flex-1 bg-gray-100 text-slate-600 text-sm py-3 px-3 rounded-lg hover:bg-gray-200 flex items-center justify-center gap-2 cursor-pointer transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    還原匯入
                    <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(this)">
                </label>
            </div>
            <p class="text-xs text-center text-gray-300 mt-2">v1.7</p>
        </div>
    </div>

    <script src="src/allocation.js"></script>
    <script src="src/history.js"></script>
    <script>
        let rooms = ['A', 'B', 'C', 'D', 'E'];
        const utilities = {
            electricity: { icon: '⚡', label: '電費', meter: '電表', usage: '用電量', average: '平均電價', unit: '度' },
            water: { icon: '💧', label: '水費', meter: '水表', usage: '用水量', average: '平均水價', unit: '度' }
        };
        const historyKey = 'utility_history_records';
        const legacyHistoryKey = 'elec_history_records';
        let currentUtility = 'electricity';
        let currentResultData = null;
        let isEditMode = false;
        let selectedIds = new Set();
        let confirmCallback = null;

        document.addEventListener('DOMContentLoaded', () => {
            renderRoomInputs();
            updateUtilityUI();
            loadLastReadingsFromHistory();
        });

        function readHistory() {
            try {
                const current = localStorage.getItem(historyKey);
                const stored = current === null ? localStorage.getItem(legacyHistoryKey) : current;
                if (stored === null) return [];

                const history = normalizeHistory(JSON.parse(stored));
                if (current === null) writeHistory(history);
                return history;
            } catch (error) {
                console.warn('無法讀取歷史紀錄', error);
                return [];
            }
        }

        function writeHistory(history) {
            localStorage.setItem(historyKey, JSON.stringify(normalizeHistory(history)));
        }

        function updateUtilityUI() {
            const utility = utilities[currentUtility];
            document.getElementById('utilityType').value = currentUtility;
            document.getElementById('meterLabel').innerText = `各房${utility.meter}度數`;
            document.getElementById('totalUsageLabel').innerText = `總${utility.usage}`;
            document.getElementById('totalUsageUnit').innerText = utility.unit;
            document.getElementById('averagePriceLabel').innerText = utility.average;
            document.getElementById('averagePriceUnit').innerText = utility.unit;
        }

        function changeUtility(value) {
            if (!utilities[value] || value === currentUtility) return;
            currentUtility = value;
            clearReadingsWithoutConfirm();
            updateUtilityUI();
            loadLastReadingsFromHistory();
            showToast(`已切換為${utilities[currentUtility].label}`);
        }

        // --- 確認視窗 ---
        function showConfirm(title, message, callback) {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMessage').innerText = message;
            confirmCallback = callback;
            
            const modal = document.getElementById('confirmModal');
            const box = document.getElementById('confirmBox');
            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            });
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirmModal');
            const box = document.getElementById('confirmBox');
            modal.classList.add('opacity-0');
            box.classList.add('scale-95');
            box.classList.remove('scale-100');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                confirmCallback = null;
            }, 300);
        }

        document.getElementById('confirmActionBtn').onclick = () => {
            if (confirmCallback) confirmCallback();
            closeConfirmModal();
        };

        // --- 主要邏輯 ---
        function renderRoomInputs(details = []) {
            const container = document.getElementById('roomsContainer');
            let html = '';
            rooms.forEach((room, index) => {
                const detail = details[index] || {};
                html += `
                <div class="grid grid-cols-12 gap-2 items-center bg-gray-50 p-2 rounded-lg border border-transparent focus-within:border-slate-300 focus-within:bg-white transition-colors">
                    <div class="col-span-2">
                        <input type="text" maxlength="30" id="name_${index}" value="${escapeHtml(detail.name ?? room)}" aria-label="第 ${index + 1} 個分表名稱"
                            class="w-full bg-transparent border-b border-gray-300 focus:border-slate-500 focus:outline-none py-1 text-center font-bold text-slate-600 text-sm">
                    </div>
                    <div class="col-span-5">
                        <input type="number" inputmode="decimal" min="0" id="prev_${index}" value="${detail.prev ?? ''}" placeholder="舊" aria-label="${escapeHtml(detail.name ?? room)} 上期度數"
                            class="w-full bg-transparent border-b border-gray-300 focus:border-slate-500 focus:outline-none py-1 px-1 text-center text-gray-600 text-sm">
                    </div>
                    <div class="col-span-5">
                        <input type="number" inputmode="decimal" min="0" id="curr_${index}" value="${detail.curr ?? ''}" placeholder="新" aria-label="${escapeHtml(detail.name ?? room)} 本期度數"
                            class="w-full bg-transparent border-b border-gray-300 focus:border-emerald-500 focus:outline-none py-1 px-1 text-center text-slate-800 font-bold text-sm">
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function addRoom() {
            if (rooms.length >= 50) {
                showToast('最多可使用 50 個分表');
                return;
            }
            rooms.push(rooms.length < 26 ? String.fromCharCode(65 + rooms.length) : `分表 ${rooms.length + 1}`);
            renderRoomInputs(readRoomInputs());
        }

        function removeRoom() {
            if (rooms.length === 1) {
                showToast('至少需要一個分表');
                return;
            }
            rooms.pop();
            renderRoomInputs(readRoomInputs().slice(0, rooms.length));
        }

        function readRoomInputs() {
            return rooms.map((room, index) => ({
                name: document.getElementById(`name_${index}`)?.value.trim() || room,
                prev: document.getElementById(`prev_${index}`)?.value ?? '',
                curr: document.getElementById(`curr_${index}`)?.value ?? ''
            }));
        }

        function loadLastReadingsFromHistory() {
            const latestRecord = readHistory().find(record => record.utility === currentUtility);
            if (latestRecord) {
                rooms = latestRecord.details.map(detail => detail.name);
                renderRoomInputs();
                let hasAutoFilled = false;
                latestRecord.details.forEach((detail, index) => {
                    const prevInput = document.getElementById(`prev_${index}`);
                    if (prevInput) {
                        prevInput.value = detail.curr;
                        hasAutoFilled = true;
                    }
                });
                if (hasAutoFilled) {
                    showToast(`已自動帶入 ${latestRecord.date} 的${utilities[currentUtility].meter}度數`);
                }
            }
        }

        function calculate() {
            const billTotal = parseFloat(document.getElementById('totalBill').value);
            if (isNaN(billTotal) || billTotal <= 0) {
                showToast('請輸入正確的帳單金額');
                return;
            }

            let totalUsage = 0;
            let roomDetails = [];
            let isValid = true;

            rooms.forEach((room, index) => {
                const name = document.getElementById(`name_${index}`).value.trim() || `分表 ${index + 1}`;
                const prev = parseFloat(document.getElementById(`prev_${index}`).value) || 0;
                const curr = parseFloat(document.getElementById(`curr_${index}`).value) || 0;
                const usage = curr - prev;

                if (prev < 0 || curr < 0) {
                    alert(`${name} 的度數不能是負數`);
                    isValid = false;
                    return;
                }

                if (usage < 0) {
                    alert(`${name} 的度數異常！\n本期 (${curr}) 不能小於上期 (${prev})`);
                    isValid = false;
                    return;
                }
                totalUsage += usage;
                roomDetails.push({ name, usage: usage, prev, curr });
            });

            if (!isValid) return;
            if (totalUsage === 0) {
                showToast(`總${utilities[currentUtility].usage}為 0，無法計算`);
                return;
            }

            const result = allocateBill(billTotal, roomDetails);
            const unitPrice = result.unitPrice;

            document.getElementById('totalUsageDisplay').innerText = totalUsage;
            document.getElementById('unitPriceDisplay').innerText = unitPrice.toFixed(2);

            const listContainer = document.getElementById('breakdownList');
            listContainer.innerHTML = '';

            const computedDetails = result.details;
            computedDetails.forEach(room => {
                listContainer.innerHTML += `
                <div class="flex justify-between items-center py-2 border-b border-gray-100 last:border-0">
                    <div class="flex items-center gap-3">
                            <span class="min-w-8 h-8 px-2 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center font-bold text-sm">${escapeHtml(room.name)}</span>
                        <div class="flex flex-col">
                            <span class="text-xs text-gray-400">使用 ${room.usage} ${utilities[currentUtility].unit}</span>
                        </div>
                    </div>
                    <span class="font-bold text-slate-700">$${room.cost}</span>
                </div>`;
            });

            currentResultData = {
                id: Date.now(),
                utility: currentUtility,
                date: new Date().toLocaleDateString('zh-TW'),
                billTotal,
                totalUsage,
                unitPrice,
                details: computedDetails
            };

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = false;
            saveBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> 儲存紀錄`;
            saveBtn.classList.remove('bg-gray-400', 'cursor-not-allowed');
            saveBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700');

            document.getElementById('resultArea').classList.remove('hidden');
            document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
        }

        function resetCalculator() {
            showConfirm('重新計算', '確定要清空並開始下一筆計算嗎？', () => {
                clearReadingsWithoutConfirm();
                showToast('已重置，請輸入下一筆資料');
            });
        }
        
        function clearReadingsWithoutConfirm() {
             const inputs = document.querySelectorAll('#roomsContainer input[type="number"]');
             inputs.forEach(input => input.value = '');
             document.getElementById('totalBill').value = '';
             // 清空期數與備註
             document.getElementById('recordPeriod').value = '';
             document.getElementById('recordNote').value = '';
             
             document.getElementById('resultArea').classList.add('hidden');
             currentResultData = null;
        }

        // --- 歷史紀錄功能 ---
        function toggleHistory() {
            const overlay = document.getElementById('historyOverlay');
            const panel = document.getElementById('historyPanel');
            
            if (panel.classList.contains('closed')) {
                isEditMode = false;
                selectedIds.clear();
                updateEditToolbar();
                
                overlay.classList.remove('hidden');
                requestAnimationFrame(() => overlay.classList.remove('opacity-0'));
                panel.classList.remove('closed');
                panel.classList.add('open');
                renderHistoryList();
            } else {
                overlay.classList.add('opacity-0');
                panel.classList.remove('open');
                panel.classList.add('closed');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        // 新增：帶入歷史紀錄功能
        function loadRecord(event, id) {
            event.stopPropagation();
            
            // 顯示確認視窗，避免誤按覆蓋當前資料
            showConfirm('帶入資料', '確定要將這筆歷史紀錄填入計算機嗎？(目前的輸入將被覆蓋)', () => {
                const record = readHistory().find(r => r.id === id);

                if (record) {
                    currentUtility = record.utility;
                    updateUtilityUI();
                    clearReadingsWithoutConfirm();
                    rooms = record.details.map(detail => detail.name);
                    renderRoomInputs(record.details);

                    // 1. 填入總金額
                    document.getElementById('totalBill').value = record.billTotal;
                    
                    // 2. 填入期數與備註 (如果有)
                    document.getElementById('recordPeriod').value = record.period || '';
                    document.getElementById('recordNote').value = record.note || '';

                    // 4. 關閉面板
                    toggleHistory();

                    // 5. 自動執行計算
                    calculate();

                    // 6. 提示
                    showToast('已成功帶入並計算');
                }
            });
        }

        function saveCurrentRecord() {
            if (!currentResultData) return;

            // 讀取當下填寫的期數與備註
            const period = document.getElementById('recordPeriod').value.trim();
            const note = document.getElementById('recordNote').value.trim();

            const recordToSave = {
                ...currentResultData,
                period: period,
                note: note
            };

            let history = readHistory();
            history.unshift(recordToSave);
            writeHistory(history);

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerHTML = `✓ 已儲存`;
            saveBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
            saveBtn.classList.add('bg-gray-400', 'cursor-not-allowed');
            saveBtn.disabled = true;

            showToast('成功新增至歷史紀錄！');
            renderHistoryList();
        }

        function startNewCalculation() {
            toggleHistory(); 
            clearReadingsWithoutConfirm();
            showToast('已準備好新增紀錄');
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            selectedIds.clear();
            updateEditToolbar();
            renderHistoryList();
        }

        function updateEditToolbar() {
            const defaultTools = document.getElementById('defaultTools');
            const editTools = document.getElementById('editTools');
            const countText = document.getElementById('deleteCountText');

            if (isEditMode) {
                defaultTools.classList.add('hidden');
                editTools.classList.remove('hidden');
                countText.innerText = `確認刪除 (0)`;
            } else {
                defaultTools.classList.remove('hidden');
                editTools.classList.add('hidden');
            }
        }

        function toggleSelect(id) {
            if (!isEditMode) return;
            if (selectedIds.has(id)) selectedIds.delete(id);
            else selectedIds.add(id);
            renderHistoryList();
            document.getElementById('deleteCountText').innerText = `確認刪除 (${selectedIds.size})`;
        }

        function deleteSelected() {
            if (selectedIds.size === 0) {
                showToast('請先勾選要刪除的項目');
                return;
            }

            showConfirm('刪除紀錄', `確定要刪除這 ${selectedIds.size} 筆紀錄嗎？`, () => {
                let history = readHistory();
                history = history.filter(item => !selectedIds.has(item.id));
                writeHistory(history);
                
                isEditMode = false;
                selectedIds.clear();
                updateEditToolbar();
                renderHistoryList();
                showToast('刪除成功');
            });
        }

        function renderHistoryList() {
            const container = document.getElementById('historyContainer');
            const history = readHistory();

            if (history.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 mt-10 flex flex-col items-center gap-2"><svg class="w-10 h-10 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>尚無歷史紀錄</div>`;
                return;
            }

            let html = '';
            history.forEach(item => {
                const utility = utilities[item.utility];
                const isSelected = selectedIds.has(item.id);
                const checkboxHtml = isEditMode ? `
                    <div class="mr-3 flex-shrink-0">
                        <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center check-circle ${isSelected ? 'checked border-emerald-600 bg-emerald-600' : 'border-gray-300 bg-white'}">
                            ${isSelected ? '<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>' : ''}
                        </div>
                    </div>
                ` : '';
                const clickAction = isEditMode ? `toggleSelect(${item.id})` : `toggleDetail(${item.id})`;
                
                // 期數標籤 (若有填寫)
                const periodBadge = item.period ? `<span class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded-full font-bold mr-1">${escapeHtml(item.period)}</span>` : '';
                const utilityBadge = `<span class="bg-slate-200 text-slate-700 text-xs px-2 py-0.5 rounded-full font-bold">${utility.icon} ${utility.label}</span>`;

                html += `
                <div class="bg-white rounded-lg border ${isSelected && isEditMode ? 'border-emerald-500 ring-1 ring-emerald-500' : 'border-gray-200'} shadow-sm overflow-hidden mb-3 transition-all duration-200" onclick="${clickAction}">
                    <div class="p-3 bg-gray-50 flex items-center cursor-pointer hover:bg-gray-100 transition">
                        ${checkboxHtml}
                        <div class="flex-1 flex justify-between items-center">
                            <div>
                                <div class="flex items-center flex-wrap gap-1 mb-0.5">
                                    ${utilityBadge}
                                    ${periodBadge}
                                    <span class="text-xs text-gray-400 font-medium">${escapeHtml(item.date)}</span>
                                </div>
                                <div class="text-sm font-bold text-slate-700">總額: $${item.billTotal}</div>
                            </div>
                            <div class="flex items-center gap-2">
                                 <span class="text-xs text-emerald-600 font-medium">$${item.unitPrice.toFixed(2)}/${utility.unit}</span>
                                 ${!isEditMode ? `<svg id="icon-${item.id}" class="w-4 h-4 text-gray-400 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>` : ''}
                            </div>
                        </div>
                    </div>
                    ${!isEditMode ? `
                    <div id="detail-${item.id}" class="hidden p-3 border-t border-gray-100 bg-white text-sm">
                        <div class="space-y-1 mb-3">
                            ${item.details.map(d => `
                                <div class="flex justify-between text-gray-600">
                                    <span>房 ${escapeHtml(d.name)} (${d.usage}${utility.unit})</span>
                                    <span class="font-bold text-slate-700">$${d.cost}</span>
                                </div>
                            `).join('')}
                        </div>
                        
                        ${item.note ? `
                        <div class="mt-3 pt-3 border-t border-gray-100 text-xs text-gray-500 bg-gray-50 p-2 rounded">
                            <span class="font-bold text-gray-600">備註：</span>${escapeHtml(item.note)}
                        </div>
                        ` : ''}

                        <div class="mt-3 pt-2 border-t border-gray-100 flex justify-end">
                             <button onclick="loadRecord(event, ${item.id})" class="bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-2 rounded-lg text-xs font-bold transition flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                                帶入此筆計算
                             </button>
                        </div>
                    </div>
                    ` : ''}
                </div>`;
            });
            container.innerHTML = html;
        }

        function toggleDetail(id) {
            if (isEditMode) return;
            const detail = document.getElementById(`detail-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            if (detail.classList.contains('hidden')) {
                detail.classList.remove('hidden');
                icon.classList.add('rotate-180');
            } else {
                detail.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        }

        function copyToClipboard() {
            if (!currentResultData) {
                 showToast('請先進行計算');
                 return;
            }

            const unitPrice = currentResultData.unitPrice.toFixed(2);
            const totalUsage = currentResultData.totalUsage;
            const bill = currentResultData.billTotal;
            
            const period = document.getElementById('recordPeriod').value.trim();
            const note = document.getElementById('recordNote').value.trim();
            const utility = utilities[currentResultData.utility];

            let text = `${utility.icon} ${utility.label}分攤明細 ${utility.icon}\n`;
            if (period) text += `📅 期數: ${period}\n`;
            text += `----------------\n`;
            text += `總金額: $${bill}\n`;
            text += `總${utility.usage}: ${totalUsage}${utility.unit}\n`;
            text += `${utility.average}: $${unitPrice}/${utility.unit}\n`;
            text += `----------------\n`;
            
            currentResultData.details.forEach(d => {
                text += `🏠 房${d.name}: ${d.prev}--->${d.curr} (使用 ${d.usage} ${utility.unit})\n`;
            });

            text += `----------------\n`;
            text += `(使用度數 × ${utility.average})\n`;

            currentResultData.details.forEach(d => {
                text += `🏠 房${d.name}: $${d.cost}\n`;
            });

            if (note) {
                text += `----------------\n`;
                text += `📝 備註: ${note}\n`;
            }

            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                if (document.execCommand('copy')) showToast('已複製到剪貼簿！');
                else showToast('複製失敗，請手動複製');
            } catch (err) {
                showToast('複製失敗');
            }
            document.body.removeChild(textArea);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function exportData() {
            const backup = { schemaVersion: 2, history: readHistory(), timestamp: new Date().toISOString() };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backup));
            const downloadAnchorNode = document.createElement('a');
            const dateStr = new Date().toISOString().split('T')[0];
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", `家庭水電費備份_${dateStr}.json`);
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importData(input) {
            const file = input.files[0];
            if (!file) return;
            if (file.size > 2 * 1024 * 1024) {
                showToast('備份檔案過大，無法匯入！');
                input.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const backup = JSON.parse(e.target.result);
                    writeHistory(normalizeHistory(backup.history));
                    showToast('資料匯入成功！頁面將重新整理。');
                    setTimeout(() => location.reload(), 1000);
                } catch (err) {
                    showToast('檔案格式錯誤，無法匯入！');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
