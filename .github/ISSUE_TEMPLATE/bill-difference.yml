name: Bill difference
description: Share a de-identified estimate versus official bill difference.
title: "[Bill difference]: "
labels: [validation]
body:
  - type: markdown
    attributes:
      value: Never upload an unredacted bill. Remove names, addresses, meter/account numbers, barcodes, and payment identifiers.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all names, addresses, account or meter numbers, barcodes, payment identifiers, credentials, and unredacted bill images.
          required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [Taipower, Taiwan Water, Taipei Water]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MeterClarity version or commit
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: De-identified inputs and difference
      description: Include tariff plan, billing dates, usage, optional line items, estimate, and official total.
    validations:
      required: true
