name: 功能建議
description: 描述真實使用情境與希望改善的流程
title: "[Feature] "
body:
  - type: textarea
    id: use-case
    attributes:
      label: 使用情境
      description: 誰會在什麼情況下需要這項功能？請勿提供個人資料。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議做法
      description: 說明目前流程的限制與希望達成的結果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 現有替代方式
      description: 如果目前有暫時的解法，請一併說明。
