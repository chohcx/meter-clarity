name: 分享使用經驗
description: 分享不含個人資料的實際使用情境與結果
title: "[Usage] "
body:
  - type: dropdown
    id: utility
    attributes:
      label: 使用的帳單類型
      options:
        - 電費
        - 水費
        - 兩者皆有
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: 使用情境
      options:
        - 房東或代管者
        - 租客或室友
        - 家庭成員
        - 其他共用分表情境
    validations:
      required: true
  - type: dropdown
    id: meter-count
    attributes:
      label: 分表數量範圍
      options:
        - 1–3 個
        - 4–10 個
        - 11 個以上
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 使用結果
      description: 這個工具是否完成了你的分攤工作？哪些部分最有幫助？
    validations:
      required: true
  - type: textarea
    id: limitation
    attributes:
      label: 尚未解決的需求
      description: 可選填目前仍需手動處理或希望改善的部分。
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開內容確認
      options:
        - label: 我知道這份回饋將公開顯示，且未包含姓名、地址、帳號、真實帳單或其他個人資料。
          required: true
