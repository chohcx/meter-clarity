name: Tariff source monitor

on:
  schedule:
    - cron: "20 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: tariff-check
        continue-on-error: true
        run: npm run check:tariffs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tariff-monitor-report
          path: tmp/tariff-monitor-report.json
      - if: steps.tariff-check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh issue list --state open --search 'Tariff source requires review in:title' --json number --jq 'length > 0' | grep -q true; then
            gh issue create --title 'Tariff source requires review' --body 'The weekly source check detected a missing rate marker or unavailable official page. Review the workflow artifact, compare the official source, update golden tests, and merge only after maintainer approval.'
          fi
          exit 1
